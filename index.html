<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KURA · Market Comps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
  :root {
    --bg: #0B0A08;
    --surface: #131210;
    --border: rgba(201,168,76,0.15);
    --gold: #C9A84C;
    --gold-dim: rgba(201,168,76,0.5);
    --cream: #F0EBE0;
    --muted: rgba(240,235,224,0.45);
    --wine: #7B2D3A;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 14px; }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }
  .gate {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 32px;
    max-width: 420px;
    width: 100%;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
  }
  .crest {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(48px, 8vw, 72px);
    font-weight: 300;
    line-height: 1.0;
    letter-spacing: -0.01em;
    color: var(--cream);
    margin-bottom: 6px;
  }
  h1 em { font-style: italic; color: var(--gold); }
  .subtitle {
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 14px;
    margin-bottom: 44px;
  }
  .vine {
    display: block;
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto;
  }
  .gate-form { margin-top: 12px; }
  .gate-label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
    font-weight: 500;
  }
  .gate-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 14px 4px;
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    text-align: center;
    letter-spacing: 0.15em;
    outline: none;
    transition: border-color 0.3s;
  }
  .gate-input:focus { border-bottom-color: var(--gold); }
  .gate-input::placeholder { color: rgba(240,235,224,0.2); letter-spacing: 0.25em; }
  .gate-button {
    margin-top: 24px;
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 14px 32px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .gate-button:hover { background: rgba(201,168,76,0.08); border-color: var(--gold); }
  .gate-button:disabled { opacity: 0.4; cursor: wait; }
  .gate-msg {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 0.1em;
    min-height: 16px;
    color: var(--muted);
  }
  .gate-msg.error { color: #c9826b; }
  .gate-msg.loading { color: var(--gold-dim); }
  .confidential {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    font-size: 9px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(240,235,224,0.25);
    z-index: 1;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s; }
</style>
</head>
<body>
  <div class="gate">
    <div class="crest">BOA · Hotels &amp; Resorts</div>
    <h1>KURA <em>Market Comps</em></h1>
    <span class="vine"></span>
    <p class="subtitle">Confidential · Investor Access</p>

    <form class="gate-form" id="gate-form" autocomplete="off">
      <label class="gate-label" for="gate-pw">Access Code</label>
      <input type="password" id="gate-pw" class="gate-input" placeholder="• • • • • • • •" autofocus required>
      <button type="submit" class="gate-button" id="gate-btn">Enter</button>
      <div class="gate-msg" id="gate-msg">&nbsp;</div>
    </form>
  </div>

  <div class="confidential">Confidential · BOA Hotels &amp; Resorts · 2026</div>

const ITERATIONS = 100000;

const form = document.getElementById('gate-form');
const input = document.getElementById('gate-pw');
const btn = document.getElementById('gate-btn');
const msg = document.getElementById('gate-msg');
const gate = document.querySelector('.gate');

function tryUnlock(password) {
  // Decode base64 bundle
  const bundleWA = CryptoJS.enc.Base64.parse(BUNDLE);
  const bundleBytes = bundleWA.sigBytes;

  // Extract salt(16) + iv(16) + ciphertext
  const saltWords = bundleWA.words.slice(0, 4);
  const ivWords = bundleWA.words.slice(4, 8);
  const ctWords = bundleWA.words.slice(8);
  const ctLen = bundleBytes - 32;

  const salt = CryptoJS.lib.WordArray.create(saltWords, 16);
  const iv = CryptoJS.lib.WordArray.create(ivWords, 16);
  const ciphertext = CryptoJS.lib.WordArray.create(ctWords, ctLen);

  // PBKDF2 key derivation (SHA-256)
  const key = CryptoJS.PBKDF2(password, salt, {
    keySize: 256 / 32,
    iterations: ITERATIONS,
    hasher: CryptoJS.algo.SHA256
  });

  // AES-256-CBC decrypt
  const decrypted = CryptoJS.AES.decrypt(
    { ciphertext: ciphertext },
    key,
    { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
  );

  const plaintext = decrypted.toString(CryptoJS.enc.Utf8);
  if (!plaintext || plaintext.length < 100) {
    throw new Error('Invalid password');
  }
  return plaintext;
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const pw = input.value.trim();
  if (!pw) return;
  btn.disabled = true;
  msg.className = 'gate-msg loading';
  msg.textContent = 'UNLOCKING...';

  // Defer to next tick so UI updates
  setTimeout(() => {
    try {
      const html = tryUnlock(pw);
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      msg.className = 'gate-msg error';
      msg.textContent = 'INCORRECT ACCESS CODE';
      gate.classList.add('shake');
      setTimeout(() => gate.classList.remove('shake'), 500);
      btn.disabled = false;
      input.value = '';
      input.focus();
    }
  }, 50);
});
</script>
