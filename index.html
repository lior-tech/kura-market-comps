<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KURA · Douro Valley · Investor Data Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
  :root {
    --warm-grey:      #E2DFD6;
    --warm-grey-deep: #D6D2C5;
    --green:          #233b34;
    --green-dim:      rgba(35,59,52,0.55);
    --cream:          #1a1a18;
    --muted:          rgba(26,26,24,0.55);
    --border:         rgba(35,59,52,0.18);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 14px; }
  body {
    background: var(--warm-grey);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    background-size: 200px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }
  .gate {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 32px;
    max-width: 440px;
    width: 100%;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
  }
  .gate-mark {
    height: 56px;
    width: auto;
    opacity: 0.95;
    margin-bottom: 24px;
  }
  .crest {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(38px, 6vw, 56px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -0.005em;
    color: var(--cream);
    margin-bottom: 6px;
  }
  h1 em { font-style: italic; color: var(--green); }
  .vine {
    display: block;
    width: 56px;
    height: 18px;
    border-top: 1px solid var(--green-dim);
    border-radius: 56px 56px 0 0;
    margin: 22px auto 18px;
  }
  .subtitle {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 8px;
    margin-bottom: 44px;
    font-weight: 400;
  }
  .gate-form { display: flex; flex-direction: column; gap: 14px; }
  .gate-label {
    font-size: 9.5px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 600;
    text-align: left;
  }
  .gate-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 14px 4px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    letter-spacing: 0.18em;
    color: var(--cream);
    text-align: center;
    outline: none;
    transition: border-color 0.3s;
  }
  .gate-input:focus { border-bottom-color: var(--green); }
  .gate-input::placeholder { color: rgba(26,26,24,0.25); letter-spacing: 0.3em; }
  .gate-button {
    margin-top: 14px;
    background: var(--green);
    color: var(--warm-grey);
    border: none;
    padding: 14px 24px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.3s, transform 0.2s;
  }
  .gate-button:hover { opacity: 0.88; }
  .gate-button:active { transform: scale(0.98); }
  .gate-button:disabled { opacity: 0.4; cursor: wait; }
  .gate-msg {
    margin-top: 14px;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    min-height: 16px;
    color: var(--muted);
    font-weight: 500;
  }
  .gate-msg.error { color: #8b3326; }
  .gate-msg.loading { color: var(--green-dim); }
  .confidential {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    font-size: 9px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(26,26,24,0.35);
    z-index: 1;
    font-weight: 500;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s; }
</style>
</head>
<body>
  <div class="gate">
    <img src="assets/kura-wordmark-bold.png" alt="KURA" class="gate-mark">
    <div class="crest">BOA Hotels &middot; Douro Valley</div>
    <h1>Investor <em>Data Room</em></h1>
    <span class="vine"></span>
    <p class="subtitle">Confidential &middot; Access by code only</p>

    <form class="gate-form" id="gate-form" autocomplete="off">
      <label class="gate-label" for="gate-pw">Access Code</label>
      <input type="password" id="gate-pw" class="gate-input" placeholder="• • • • • • • •" autofocus required>
      <button type="submit" class="gate-button" id="gate-btn">Enter</button>
      <div class="gate-msg" id="gate-msg">&nbsp;</div>
    </form>
  </div>

  <div class="confidential">Confidential · BOA Hotels · 2026</div>

const ITERATIONS = 100000;

const form = document.getElementById('gate-form');
const input = document.getElementById('gate-pw');
const btn = document.getElementById('gate-btn');
const msg = document.getElementById('gate-msg');
const gate = document.querySelector('.gate');

function tryUnlock(password) {
  const bundleWA = CryptoJS.enc.Base64.parse(BUNDLE);
  const bundleBytes = bundleWA.sigBytes;
  const saltWords = bundleWA.words.slice(0, 4);
  const ivWords = bundleWA.words.slice(4, 8);
  const ctWords = bundleWA.words.slice(8);
  const ctLen = bundleBytes - 32;
  const salt = CryptoJS.lib.WordArray.create(saltWords, 16);
  const iv = CryptoJS.lib.WordArray.create(ivWords, 16);
  const ciphertext = CryptoJS.lib.WordArray.create(ctWords, ctLen);
  const key = CryptoJS.PBKDF2(password, salt, {
    keySize: 256 / 32,
    iterations: ITERATIONS,
    hasher: CryptoJS.algo.SHA256
  });
  const decrypted = CryptoJS.AES.decrypt(
    { ciphertext: ciphertext }, key,
    { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
  );
  const plaintext = decrypted.toString(CryptoJS.enc.Utf8);
  if (!plaintext || plaintext.length < 100) throw new Error('Invalid password');
  return plaintext;
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const pw = input.value.trim();
  if (!pw) return;
  btn.disabled = true;
  msg.className = 'gate-msg loading';
  msg.textContent = 'UNLOCKING...';
  setTimeout(() => {
    try {
      const html = tryUnlock(pw);
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      msg.className = 'gate-msg error';
      msg.textContent = 'INCORRECT ACCESS CODE';
      gate.classList.add('shake');
      setTimeout(() => gate.classList.remove('shake'), 500);
      btn.disabled = false;
      input.value = '';
      input.focus();
    }
  }, 50);
});
</script>
